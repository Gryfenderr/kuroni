    <!-- API -->
    <script>
        const titreSearch = document.getElementById('titreSearch');
        const imgPreview = document.getElementById('previewImg');
        const imgURL = document.getElementById('imgURL');
        const titrenatif = document.getElementById('titrenatif');
        const titrermji = document.getElementById('titrermji');
        const titreen = document.getElementById('titreen');
        const checkboxsf = document.getElementById('checkboxsf');
        let idanime = "";

        let timeout = null;

        if (titreSearch) {
            titreSearch.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                const query = `
                query ($search: String) {
                    Media(search: $search, type: ANIME) {
                        id
                        title {
                            romaji
                            english
                            native
                        }
                        coverImage {
                            large
                        }
                        description
                    }
                }`;
                const variables = {
                search: titreSearch.value.trim()
                };

                fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: variables
                    })
                })
                .then(res => res.json())
                .then(data => {
                    // Traitement des données reçues
                    if (data.data && data.data.Media) {
                        const anime = data.data.Media;
                        // Vous pouvez maintenant utiliser les informations de l'anime
                        // Par exemple, afficher l'image et le titre
                        if (anime.coverImage && anime.coverImage.large) {
                            imgPreview.src = anime.coverImage.large;
                            imgURL.value = anime.coverImage.large;
                            console.log(imgURL.value);
                            imgPreview.style.display = 'block';
                            titrenatif.value = anime.title.native;
                            titrermji.value = anime.title.romaji;
                            titreen.value = anime.title.english;
                            idanime = String(anime.id);
                            if (anime.title.english == null) {
                                document.getElementById('languepref').value = 'NA';
                            }
                            else{
                                document.getElementById('languepref').value = 'EN';
                            }
                            getIfAnimeExist(idanime);
                        } else {
                            imgPreview.style.display = 'none';
                            titrenatif.value = "";
                            titrermji.value = "";
                            titreen.value = "";
                            getIfAnimeExist(0);
                        }

                    } else {
                        imgPreview.style.display = 'none';
                        imgURL.value = '';
                        titrenatif.value = "";
                        titrermji.value = "";
                        titreen.value = "";
                        getIfAnimeExist(0);
                    }
                })
                .catch(err => {
                    console.error('Erreur lors de l\'appel à l\'API AniList:', err);
                    imgPreview.style.display = 'none';
                    imgURL.value = '';
                    titrenatif.value = "";
                    titrermji.value = "";
                    titreen.value = "";
                    getIfAnimeExist(0);
                });
            }, 500); // délai pour éviter trop de requêtes
        });
        }
    </script>


    <!-- selectList & printCounts -->
    <script>
        function parseFilter(filter) {
            if (!filter) return [];
            return filter.split(',').map(s => s.trim()).filter(Boolean);
        }

        let currentFilterValue = 'toview,next,waiting,dropped,restart,again';

        function setNavFilter(button, filter) {
            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            currentFilterValue = filter;
            selectList(parseFilter(filter));
        }

        function showView(viewName) {
            const gridPanel = document.getElementById('gridAnime');
            const settingsPanel = document.getElementById('settingsView');
            const searchPanel = document.getElementById('searchView');

            document.querySelectorAll('.view-panel').forEach(panel => {
                const isActive = panel.id === viewName;
                panel.classList.toggle('active', isActive);
                panel.hidden = !isActive;
            });

            if (gridPanel) {
                gridPanel.style.display = viewName === 'gridAnime' ? '' : 'none';
            }

            if (settingsPanel) {
                settingsPanel.style.display = viewName === 'settingsView' ? 'block' : 'none';
            }

            if (searchPanel) {
                searchPanel.style.display = viewName === 'searchView' ? 'block' : 'none';
            }

            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));

            if (viewName === 'settingsView') {
                const settingsButton = document.querySelector('.bottom-nav button[data-view="settings"]');
                if (settingsButton) settingsButton.classList.add('active');
            } else if (viewName === 'searchView') {
                const searchButton = document.querySelector('.bottom-nav button[data-view="search"]');
                if (searchButton) searchButton.classList.add('active');
            } else {
                const matchingButton = Array.from(document.querySelectorAll('.bottom-nav button[data-filter]'))
                    .find(btn => btn.dataset.filter === currentFilterValue);
                const fallbackButton = document.querySelector('.bottom-nav button[data-filter="toview,next,waiting,dropped,restart,again"]');
                const buttonToActivate = matchingButton || fallbackButton;
                if (buttonToActivate) buttonToActivate.classList.add('active');
            }
        }

        function setSettingsView() {
            const usernameEl = document.getElementById('settingsUsername');
            if (usernameEl) {
                usernameEl.textContent = sessionStorage.getItem('username') || 'Utilisateur';
            }

            document.querySelectorAll('.view-panel').forEach(panel => {
                const isSettings = panel.id === 'settingsView';
                panel.classList.toggle('active', isSettings);
                panel.hidden = !isSettings;
            });

            const gridPanel = document.getElementById('gridAnime');
            if (gridPanel) {
                gridPanel.style.display = 'none';
            }

            const settingsPanel = document.getElementById('settingsView');
            if (settingsPanel) {
                settingsPanel.style.display = 'block';
            }

            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));
            const settingsButton = document.querySelector('.bottom-nav button[data-view="settings"]');
            if (settingsButton) settingsButton.classList.add('active');
        }

        function setSearchView() {
            const searchPanel = document.getElementById('searchView');
            const gridPanel = document.getElementById('gridAnime');
            const settingsPanel = document.getElementById('settingsView');
            const searchInput = document.getElementById('searchQuery');

            document.querySelectorAll('.view-panel').forEach(panel => {
                const isSearch = panel.id === 'searchView';
                panel.classList.toggle('active', isSearch);
                panel.hidden = !isSearch;
            });

            if (gridPanel) {
                gridPanel.style.display = 'none';
            }
            if (settingsPanel) {
                settingsPanel.style.display = 'none';
            }
            if (searchPanel) {
                searchPanel.style.display = 'block';
            }

            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));
            const searchButton = document.querySelector('.bottom-nav button[data-view="search"]');
            if (searchButton) searchButton.classList.add('active');

            if (searchInput) {
                searchInput.focus();
            }
        }

        function activateNavButton(button) {
            if (!button) return;
            if (button.dataset.view === 'settings') {
                setSettingsView();
                return;
            }
            if (button.dataset.view === 'search') {
                setSearchView();
                return;
            }
            showView('gridAnime');
            setNavFilter(button, button.dataset.filter);
        }

        const navButtons = document.querySelectorAll('.bottom-nav button[data-filter]');
        navButtons.forEach(button => {
            button.addEventListener('click', function() {
                activateNavButton(this);
            });
        });

        document.querySelectorAll('.bottom-nav button[data-view="settings"], .bottom-nav button[data-view="search"]').forEach(button => {
            button.addEventListener('click', function(event) {
                event.preventDefault();
                activateNavButton(this);
            });
        });

        // Par défaut, bouton “À voir” sélectionné
        const defaultButton = document.querySelector('.bottom-nav button[data-filter="toview,next,waiting,dropped,restart,again"]');
        if (defaultButton) {
            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));
            defaultButton.classList.add('active');
        }

        selectList(parseFilter('toview,next,waiting,dropped,restart,again'));
        printCounts();

        // Swipe navigation for mobile
        const swipeArea = document.querySelector('main');
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        function getNavButtons() {
            return Array.from(document.querySelectorAll('.bottom-nav button[data-filter], .bottom-nav button[data-view]'));
        }

        function getActiveFilterIndex() {
            const buttons = getNavButtons();
            return buttons.findIndex(btn => btn.classList.contains('active'));
        }

        function swipeToIndex(index) {
            const buttons = getNavButtons();
            if (!buttons.length) return;
            const normalizedIndex = ((index % buttons.length) + buttons.length) % buttons.length;
            const button = buttons[normalizedIndex];
            if (button) button.click();
        }

        function handleSwipe(dx, dy, duration) {
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (window.scrollY === 0 && absDy > absDx && dy > 100 && duration > 120) {
                window.location.reload();
                return;
            }

            if (absDx < 40 || absDx < absDy) return;

            const settingsPanel = document.getElementById('settingsView');
            const isSettingsActive = settingsPanel && settingsPanel.classList.contains('active');

            if (isSettingsActive && dx < 0) {
                const firstListButton = document.querySelector('.bottom-nav button[data-filter="toview,next,waiting,dropped,restart,again"]');
                if (firstListButton) {
                    showView('gridAnime');
                    setNavFilter(firstListButton, firstListButton.dataset.filter);
                }
                return;
            }

            const currentIndex = getActiveFilterIndex();
            if (currentIndex === -1) return;

            if (dx < 0) {
                swipeToIndex(currentIndex + 1);
            } else {
                swipeToIndex(currentIndex - 1);
            }
        }
        window.handleSwipe = handleSwipe;

        const pullRefreshHint = document.getElementById('pullRefreshHint');
        const grid = document.getElementById('gridAnime');

        function resetSwipeClass() {
            if (!grid) return;
            grid.classList.remove('swipe-left', 'swipe-right');
        }

        if (swipeArea) {
            const handleTouchStart = event => {
                if (event.touches.length !== 1) return;
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
                touchStartTime = Date.now();
                if (pullRefreshHint) {
                    pullRefreshHint.classList.remove('active');
                }
            };

            const handleTouchMove = event => {
                if (event.touches.length !== 1) return;
                const touch = event.touches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                if (window.scrollY === 0 && dy > 40 && Math.abs(dy) > Math.abs(dx) && pullRefreshHint) {
                    pullRefreshHint.classList.add('active');
                } else if (pullRefreshHint) {
                    pullRefreshHint.classList.remove('active');
                }

                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
                    event.preventDefault();
                }
            };

            const handleTouchEnd = event => {
                const touch = event.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const duration = Date.now() - touchStartTime;
                if (grid) {
                    if (Math.abs(dx) >= Math.abs(dy) && Math.abs(dx) >= 40) {
                        grid.classList.add(dx < 0 ? 'swipe-left' : 'swipe-right');
                        window.setTimeout(resetSwipeClass, 220);
                    }
                }
                handleSwipe(dx, dy, duration);
                if (pullRefreshHint) {
                    pullRefreshHint.classList.remove('active');
                }
            };

            swipeArea.addEventListener('touchstart', handleTouchStart, { passive: true });
            swipeArea.addEventListener('touchmove', handleTouchMove, { passive: false });
            swipeArea.addEventListener('touchend', handleTouchEnd, { passive: true });
        }
    </script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Login Kuroni</title>    
  <link rel="stylesheet" href="styles/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://fwdqeibadcyxcvdcuqjt.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3ZHFlaWJhZGN5eGN2ZGN1cWp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1MjU0ODIsImV4cCI6MjA3MTEwMTQ4Mn0.CAUlJIATUnRTsYig4THdEZiwBXS72CJxDCO-oBqj-pQ';
    const Supabase = supabase.createClient(supabaseUrl, supabaseKey);
  </script>
  <script src="scripts/script.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/favicon.ico">
</head>
<body>
  <div class="splash-screen" id="splashScreen" aria-label="Chargement de Kuroni">
    <div class="splash-logo" aria-hidden="true">
      <img class="splash-image" src="icons/icon-512-removebg.png" alt="">
    </div>
  </div>

  <div class="login-container" id="loginContainer" inert aria-hidden="true">
    <div class="login-card">
      <header class="login-header">
        <p class="login-kicker">Anime list</p>
        <h1 class="title">Kuroni</h1>
        <p class="subtitle">Retrouve ta liste d’animes et reprends exactement là où tu t’es arrêté.</p>
      </header>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" placeholder="ex: otaku123" autocomplete="username" autocapitalize="none" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Ton mot de passe" autocomplete="current-password" required>
        </div>

        <p class="login-status" id="loginStatus" role="alert" aria-live="polite"></p>
        <button class="login-btn" id="loginButton" type="submit">Se connecter</button>
      </form>
    </div>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginButton = document.getElementById('loginButton');
    const loginStatus = document.getElementById('loginStatus');
    const splashScreen = document.getElementById('splashScreen');
    const loginContainer = document.getElementById('loginContainer');
    let loginSubmitted = false;

    function finishSplash() {
      document.body.classList.add('splash-done');
      document.querySelector('.login-card').classList.add('login-visible');
      loginContainer.removeAttribute('inert');
      loginContainer.removeAttribute('aria-hidden');
      window.setTimeout(() => usernameInput.focus(), 750);
      window.setTimeout(() => splashScreen.remove(), 650);
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      finishSplash();
    } else {
      window.setTimeout(finishSplash, 2200);
    }

    async function submitLogin() {
      if (loginSubmitted || !usernameInput.value || !passwordInput.value) return;
      loginSubmitted = true;
      loginButton.disabled = true;
      loginButton.textContent = 'Connexion...';
      loginStatus.textContent = '';

      const authenticated = await login(usernameInput.value.trim(), passwordInput.value);
      if (!authenticated) {
        loginSubmitted = false;
        loginButton.disabled = false;
        loginButton.textContent = 'Se connecter';
        loginStatus.textContent = 'Identifiants incorrects. Vérifie tes informations.';
      }
    }

    loginForm.addEventListener('submit', event => {
      event.preventDefault();
      submitLogin();
    });

    // Certains navigateurs remplissent les champs sans émettre d'événement input.
    const autofillCheck = window.setInterval(() => {
      if (document.visibilityState === 'visible' && usernameInput.value && passwordInput.value) {
        window.clearInterval(autofillCheck);
        submitLogin();
      }
    }, 250);
  </script>
</body>
</html>
